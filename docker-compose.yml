services:
  abeat:
    build:
      context: .
      args:
        ML: "1"   # 0 = librosa-only image (smaller, less accurate beat tracking)
    image: abeat
    ports:
      - "8080:8080"
      - "8443:8443"   # https for ArcViewer previews (self-signed)
    volumes:
      - abeat-data:/data
    restart: unless-stopped

volumes:
  abeat-data:
