[project]
name = "abeat-analysis"
version = "0.1.0"
description = "Audio analysis worker for abeat: beats, sections, onsets, energy -> analysis.json"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "mutagen>=1.47",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Heavier ML models (CPU works, GPU is faster). Install with: uv sync --extra ml
ml = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "beat-this",
    "demucs>=4.0.1",
]

[project.scripts]
abeat-analyze = "abeat_analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abeat_analysis"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
